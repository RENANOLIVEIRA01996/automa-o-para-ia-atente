# Blueprint gratuito para testar o painel e a API da Recepia.
# O Render Free hiberna após inatividade e não preserva arquivos locais.
# WhatsApp exige uma Evolution externa, configurada depois no painel do serviço.
services:
  - type: web
    name: recepia-saas-api
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    dockerfilePath: ./recepia/Dockerfile
    dockerContext: ./recepia
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "false"
      - key: RUN_DB_MIGRATIONS_ON_STARTUP
        value: "false"
      - key: FILE_UPLOADS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_SECRET
        sync: false
      - key: EVOLUTION_API_URL
        value: ""
      - key: EVOLUTION_API_KEY
        value: ""
      - key: PUBLIC_WEBHOOK_URL
        fromService:
          type: web
          name: recepia-saas-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        fromService:
          type: web
          name: recepia-saas-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SAAS_LIMITS_ENABLED
        value: "false"
