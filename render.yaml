# Blueprint de produção para o repositório RENANOLIVEIRA01996/automa-o-para-ia-atente.
# A criação do Blueprint inicia um deploy; consulte DEPLOY_RENDER.md antes de aplicar.
# Nenhum banco PostgreSQL do Render é criado: API e Evolution usam URLs Neon separadas.
services:
  - type: web
    name: recepia-saas-api
    runtime: docker
    plan: 1c-2g
    autoDeployTrigger: "off"
    dockerfilePath: ./recepia/Dockerfile
    dockerContext: ./recepia
    healthCheckPath: /health
    disk:
      name: recepia-files
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "false"
      - key: RUN_DB_MIGRATIONS_ON_STARTUP
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_SECRET
        sync: false
      - key: EVOLUTION_API_KEY
        fromService:
          type: pserv
          name: recepia-saas-evolution
          envVarKey: AUTHENTICATION_API_KEY
      - key: EVOLUTION_API_HOSTPORT
        fromService:
          type: pserv
          name: recepia-saas-evolution
          property: hostport
      - key: PUBLIC_WEBHOOK_URL
        fromService:
          type: web
          name: recepia-saas-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        fromService:
          type: web
          name: recepia-saas-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SAAS_LIMITS_ENABLED
        value: "false"

  - type: pserv
    name: recepia-saas-evolution
    runtime: docker
    plan: 1c-2g
    autoDeployTrigger: "off"
    dockerfilePath: ./recepia/Dockerfile.evolution
    dockerContext: ./recepia
    disk:
      name: evolution-instances
      mountPath: /evolution/instances
      sizeGB: 1
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        sync: false
      - key: QRCODE_LIMIT
        value: "30"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: ERROR,WARN,INFO

  - type: worker
    name: recepia-saas-worker
    runtime: docker
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    dockerfilePath: ./recepia/Dockerfile
    dockerContext: ./recepia
    dockerCommand: python cron/jobs.py
    envVars:
      - key: WORKER_PROCESS
        value: "true"
      - key: DEBUG
        value: "false"
      - key: RUN_DB_MIGRATIONS_ON_STARTUP
        value: "false"
      - key: DATABASE_URL
        fromService:
          type: web
          name: recepia-saas-api
          envVarKey: DATABASE_URL
      - key: JWT_SECRET
        fromService:
          type: web
          name: recepia-saas-api
          envVarKey: JWT_SECRET
      - key: ADMIN_API_KEY
        fromService:
          type: web
          name: recepia-saas-api
          envVarKey: ADMIN_API_KEY
      - key: EVOLUTION_WEBHOOK_SECRET
        fromService:
          type: web
          name: recepia-saas-api
          envVarKey: EVOLUTION_WEBHOOK_SECRET
      - key: EVOLUTION_API_KEY
        fromService:
          type: pserv
          name: recepia-saas-evolution
          envVarKey: AUTHENTICATION_API_KEY
      - key: EVOLUTION_API_HOSTPORT
        fromService:
          type: pserv
          name: recepia-saas-evolution
          property: hostport
      - key: TIMEZONE
        value: America/Sao_Paulo
