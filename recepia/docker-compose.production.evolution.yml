name: recepia-evolution

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recepia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: recepia
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U recepia -d evolution -tAc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [recepia_net]

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Configure EVOLUTION_API_KEY}
      QRCODE_LIMIT: "30"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://recepia:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      LOG_LEVEL: ERROR,WARN,INFO
      WEBHOOK_GLOBAL_URL: http://${API_PRIVATE_IP:?Configure API_PRIVATE_IP}:8000/api/webhook/evolution
      WEBHOOK_GLOBAL_ENABLED: "false"
    ports:
      - "${EVOLUTION_PRIVATE_IP:?Configure EVOLUTION_PRIVATE_IP}:8080:8080"
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');const r=h.get('http://127.0.0.1:8080/',x=>process.exit(x.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 90s
    logging: *logs
    networks: [recepia_net]

volumes:
  postgres_data:
  evolution_data:

networks:
  recepia_net:
    driver: bridge
